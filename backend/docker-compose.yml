version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: pharmx_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pharmx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pharmx_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmx_fastapi
    restart: always
    command: sh -c "alembic upgrade head || true && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/code
      - uploads_shared:/code/uploads
      - outputs_shared:/code/outputs
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/pharmx_db
      - REDIS_URL=redis://redis:6379/0
      - VINA_EXECUTABLE=/usr/bin/vina
      - OBABEL_EXECUTABLE=/usr/bin/obabel
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmx_celery
    restart: always
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    volumes:
      - .:/code
      - uploads_shared:/code/uploads
      - outputs_shared:/code/outputs
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/pharmx_db
      - REDIS_URL=redis://redis:6379/0
      - VINA_EXECUTABLE=/usr/bin/vina
      - OBABEL_EXECUTABLE=/usr/bin/obabel
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_shared:
  outputs_shared:
